name: Verify ChatGPT foundation

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm audit --audit-level=moderate
      - run: npm run check
      - run: npm run test
      - run: npm run build
      - name: Verify editable PowerPoint export with real PPTX ZIP
        run: npm run test:export
      - name: Install Chromium for real screenshot verification
        run: npx playwright install --with-deps chromium
      - name: Validate two real slide screenshots
        timeout-minutes: 3
        run: npm run test:visual
      - name: Upload captured slide evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-slide-captures
          path: artifacts/
          retention-days: 3
          if-no-files-found: warn
